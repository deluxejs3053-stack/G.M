<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>사이버 톱뷰 서바이벌</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #050505; color: #00ffcc; font-family: 'Malgun Gothic', sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; cursor: crosshair; }
        #ui { position: absolute; top: 10px; left: 10px; pointer-events: none; z-index: 100; }
        .stat-card { background: rgba(10,10,15,0.85); padding: 6px 12px; border-left: 4px solid #00ffcc; margin-bottom: 5px; border-radius: 0 8px 8px 0; font-weight: bold; font-size: 12px; box-shadow: 5px 5px 15px rgba(0,0,0,0.5); }

        /* 상점 */
        #shop { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: #0f111a; border: 2px solid #00ffcc; padding: 20px; display: none; z-index: 200; width: min(350px, 92vw); border-radius: 10px; box-shadow: 0 0 50px #000; max-height: 90vh; overflow-y: auto; }
        .shop-row { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; padding-bottom: 5px; border-bottom: 1px solid #222; }
        .btn { background: #00ffcc; border: none; padding: 8px 12px; cursor: pointer; color: #000; font-weight: bold; border-radius: 4px; }
        .btn:hover { background: #fff; }
        .btn:disabled { background: #444; color: #888; }

        /* 무기 슬롯 */
        #weapon-slots { position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 100; pointer-events: all; }
        .slot { width: 90px; height: 40px; background: rgba(0,0,0,0.8); border: 1px solid #333; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #555; border-radius: 6px; cursor: pointer; user-select: none; }
        .slot.unlocked { color: #aaa; }
        .slot.active { border-color: #00ffcc; color: #00ffcc; background: rgba(0,255,204,0.1); }

        /* 게임오버 */
        #game-over { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }

        /* ─── 모바일 가상 컨트롤 ─── */
        #mobile-controls { position: absolute; bottom: 0; left: 0; width: 100%; height: 130px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px 15px; z-index: 100; pointer-events: none; }

        /* 조이스틱 */
        #joystick-zone { width: 120px; height: 120px; position: relative; pointer-events: all; }
        #joystick-base { width: 110px; height: 110px; border-radius: 50%; background: rgba(0,255,204,0.07); border: 2px solid rgba(0,255,204,0.25); position: absolute; top: 5px; left: 5px; }
        #joystick-knob { width: 50px; height: 50px; border-radius: 50%; background: rgba(0,255,204,0.4); border: 2px solid #00ffcc; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); box-shadow: 0 0 12px #00ffcc88; transition: background 0.1s; }

        /* 오른쪽 버튼들 */
        #right-btns { display: flex; flex-direction: column; gap: 10px; align-items: flex-end; pointer-events: all; }

        /* 발사 버튼 */
        #fire-btn { width: 80px; height: 80px; border-radius: 50%; background: rgba(255,0,85,0.2); border: 3px solid #ff0055; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 0 20px #ff005566; user-select: none; }
        #fire-btn:active, #fire-btn.pressed { background: rgba(255,0,85,0.5); box-shadow: 0 0 30px #ff0055; }

        /* 상점 버튼 */
        #shop-btn { width: 55px; height: 55px; border-radius: 50%; background: rgba(241,196,15,0.15); border: 2px solid #f1c40f; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 0 12px #f1c40f66; user-select: none; }
        #shop-btn:active { background: rgba(241,196,15,0.4); }

        /* PC에서는 모바일 컨트롤 숨기기 (터치 없을 때) */
        @media (hover: hover) and (pointer: fine) {
            #mobile-controls { display: none; }
            #weapon-slots { bottom: 20px; }
        }

        /* ─── 레벨업 선택 UI ─── */
        #levelup-overlay {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.82);
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 500; backdrop-filter: blur(3px);
        }
        #levelup-title {
            font-size: clamp(20px, 5vw, 32px);
            color: #00ffcc;
            text-shadow: 0 0 20px #00ffcc;
            margin-bottom: 8px;
            letter-spacing: 2px;
            animation: pulse 0.6s ease-out;
        }
        #levelup-sub {
            font-size: 13px; color: #556; margin-bottom: 28px;
        }
        #levelup-cards {
            display: flex; gap: 14px; flex-wrap: wrap;
            justify-content: center; padding: 0 16px;
        }
        .lvup-card {
            width: clamp(130px, 28vw, 170px);
            background: #0d1018;
            border: 2px solid #223;
            border-radius: 12px;
            padding: 18px 14px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
            position: relative; overflow: hidden;
        }
        .lvup-card:hover, .lvup-card:active {
            border-color: var(--card-color, #00ffcc);
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 0 24px var(--card-color, #00ffcc88);
        }
        .lvup-card .card-icon { font-size: 36px; margin-bottom: 10px; }
        .lvup-card .card-name {
            font-size: 14px; font-weight: bold;
            color: var(--card-color, #00ffcc);
            margin-bottom: 6px;
        }
        .lvup-card .card-desc { font-size: 11px; color: #778; line-height: 1.4; }
        .lvup-card .card-rarity {
            font-size: 10px; font-weight: bold;
            margin-top: 8px; letter-spacing: 1px;
            color: var(--card-color, #00ffcc);
            opacity: 0.7;
        }
        .lvup-card.rare { --card-color: #a29bfe; }
        .lvup-card.epic { --card-color: #fd79a8; }
        .lvup-card.common { --card-color: #00ffcc; }
        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes cardIn {
            0% { transform: translateY(30px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .lvup-card { animation: cardIn 0.3s ease-out both; }
        .lvup-card:nth-child(2) { animation-delay: 0.08s; }
        .lvup-card:nth-child(3) { animation-delay: 0.16s; }
    </style>
</head>
<body>

<div id="ui">
    <div class="stat-card">레벨: <span id="lv">1</span> (<span id="exp">0</span>%)</div>
    <div class="stat-card" style="border-color:#f1c40f">크레딧: <span id="gold">0</span>G</div>
    <div class="stat-card" style="border-color:#a29bfe">강화 포인트: <span id="pts">0</span></div>
    <div class="stat-card" style="border-color:#ff0055">체력: <span id="hp">100</span></div>
    <div class="stat-card" style="border-color:#00ffcc">웨이브: <span id="wave">1</span></div>
</div>

<div id="shop">
    <h3 style="text-align:center; color:#00ffcc; margin-top:0;">네트워크 업그레이드</h3>
    <div class="shop-row"><span>공격력 증가(+3)</span> <button class="btn" onclick="upgrade('atk')">강화</button></div>
    <div class="shop-row"><span>연사 속도 강화</span> <button class="btn" onclick="upgrade('spd')">강화</button></div>
    <div class="shop-row"><span>이동 속도 증가</span> <button class="btn" onclick="upgrade('mov')">강화</button></div>
    <div class="shop-row"><span>샷건 (300G)</span> <button id="buy-w2" class="btn" onclick="buyWeapon(2, 300)">구매</button></div>
    <div class="shop-row"><span>저격총 (700G)</span> <button id="buy-w3" class="btn" onclick="buyWeapon(3, 700)">구매</button></div>
    <div class="shop-row"><span>자가 수리 (50G)</span> <button class="btn" onclick="buyItem('heal', 50)">수리</button></div>
    <button class="btn" style="background:#ff0055; color:#fff; margin-top:10px; width:100%" onclick="toggleShop()">상점 닫기 [G]</button>
</div>

<div id="weapon-slots">
    <div id="slot1" class="slot unlocked active">1. 라이플</div>
    <div id="slot2" class="slot">2. 잠김</div>
    <div id="slot3" class="slot">3. 잠김</div>
</div>

<!-- 모바일 컨트롤 -->
<div id="mobile-controls">
    <!-- 왼쪽: 조이스틱 -->
    <div id="joystick-zone">
        <div id="joystick-base"></div>
        <div id="joystick-knob"></div>
    </div>

    <!-- 오른쪽: 발사 + 상점 -->
    <div id="right-btns">
        <div id="shop-btn">🛒</div>
        <div id="fire-btn">🔥</div>
    </div>
</div>

<!-- 레벨업 선택 오버레이 -->
<div id="levelup-overlay">
    <div id="levelup-title">⚡ 시스템 업그레이드</div>
    <div id="levelup-sub">하나를 선택하세요</div>
    <div id="levelup-cards"></div>
</div>

<div id="game-over">
    <h1 style="color:#ff0055; font-size:clamp(28px,6vw,50px)">연결 종료 (임무 실패)</h1>
    <button class="btn" style="width:150px; font-size:16px; padding:12px" onclick="resetGame()">재접속</button>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

const WORLD = { w: 3000, h: 3000 };
let player = { x: 1500, y: 1500, r: 22, spd: 5.5, hp: 100, rot: 0, recoil: 0 };
let cam = { x: 1500, y: 1500 }, mouse = { x: canvas.width/2 + 100, y: canvas.height/2 }, keys = {};
let bullets = [], enemies = [], obstacles = [], barrels = [];
let stats = { lv: 1, exp: 0, gold: 0, pts: 0, wave: 1, waveKill: 0, atkBonus: 0, spdBonus: 0, totalKill: 0, bossKill: 0 };

const WEAPONS = {
    1: { name: "라이플", cool: 180, dmg: 7, spd: 22, p: 1, color: "#00ffcc", len: 40, unlocked: true },
    2: { name: "샷건", cool: 650, dmg: 5, spd: 16, p: 1, color: "#f1c40f", len: 35, unlocked: false },
    3: { name: "저격총", cool: 1100, dmg: 55, spd: 40, p: 5, color: "#e74c3c", len: 55, unlocked: false }
};

let curW = 1, lastFire = 0, isShop = false, isLevelUp = false;
let screenShake = 0, shakeX = 0, shakeY = 0;
let particles = [];

// ─── 레벨업 선택지 풀 ───
const UPGRADE_POOL = [
    { id:'atk1',  name:'공격력 강화 I',   icon:'⚔️',  desc:'공격력 +5',          rarity:'common', apply:()=>{ stats.atkBonus+=5; } },
    { id:'atk2',  name:'공격력 강화 II',  icon:'🗡️',  desc:'공격력 +10',         rarity:'rare',   apply:()=>{ stats.atkBonus+=10; } },
    { id:'spd1',  name:'연사 강화 I',     icon:'💨',  desc:'쿨다운 감소 -60ms',  rarity:'common', apply:()=>{ stats.spdBonus+=60; } },
    { id:'spd2',  name:'연사 강화 II',    icon:'⚡',  desc:'쿨다운 감소 -120ms', rarity:'rare',   apply:()=>{ stats.spdBonus+=120; } },
    { id:'mov1',  name:'기동력 업',       icon:'🦾',  desc:'이동속도 +0.6',      rarity:'common', apply:()=>{ player.spd+=0.6; } },
    { id:'hp1',   name:'긴급 수리',       icon:'💉',  desc:'체력 +30 회복',      rarity:'common', apply:()=>{ player.hp=Math.min(100,player.hp+30); updateUI(); } },
    { id:'hp2',   name:'최대 체력 증가',  icon:'❤️',  desc:'최대 체력 +20',      rarity:'rare',   apply:()=>{ player.maxHp=(player.maxHp||100)+20; player.hp+=20; updateUI(); } },
    { id:'gold1', name:'크레딧 보너스',   icon:'💰',  desc:'골드 +200G',         rarity:'common', apply:()=>{ stats.gold+=200; updateUI(); } },
    { id:'bullet',name:'관통탄',          icon:'🔫',  desc:'총알 관통+1',        rarity:'epic',   apply:()=>{ Object.values(WEAPONS).forEach(w=>w.p++); } },
    { id:'dmg3',  name:'과부하 모드',     icon:'🌟',  desc:'공격력 +20',         rarity:'epic',   apply:()=>{ stats.atkBonus+=20; } },
    { id:'w2free',name:'샷건 지급',       icon:'🔦',  desc:'샷건 무료 지급',     rarity:'rare',   apply:()=>{ if(!WEAPONS[2].unlocked){ WEAPONS[2].unlocked=true; document.getElementById('slot2').innerText='2. 샷건'; document.getElementById('slot2').classList.add('unlocked'); document.getElementById('buy-w2').disabled=true; } else { stats.atkBonus+=5; } } },
    { id:'w3free',name:'저격총 지급',     icon:'🎯',  desc:'저격총 무료 지급',   rarity:'epic',   apply:()=>{ if(!WEAPONS[3].unlocked){ WEAPONS[3].unlocked=true; document.getElementById('slot3').innerText='3. 저격총'; document.getElementById('slot3').classList.add('unlocked'); document.getElementById('buy-w3').disabled=true; } else { stats.atkBonus+=10; } } },
];

// ─── 화면 흔들림 ───
function addShake(amount) { screenShake = Math.max(screenShake, amount); }

// ─── 파티클 생성 ───
function spawnParticles(x, y, count, color, speed, life, size) {
    for(let i = 0; i < count; i++) {
        let ang = Math.random() * Math.PI * 2;
        let spd = speed * (0.4 + Math.random() * 0.6);
        particles.push({
            x, y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            life: life, maxLife: life,
            color, size: size * (0.5 + Math.random() * 0.5)
        });
    }
}

function getRandom3() {
    let pool = [...UPGRADE_POOL];
    // epic은 20% 확률로만 포함
    pool = pool.filter(u => u.rarity !== 'epic' || Math.random() < 0.2 || true);
    let chosen = [];
    while(chosen.length < 3 && pool.length > 0) {
        // 가중치: epic=1, rare=2, common=3
        let weights = pool.map(u => u.rarity==='epic'?1 : u.rarity==='rare'?2 : 3);
        let total = weights.reduce((a,b)=>a+b,0);
        let r = Math.random()*total, acc=0, idx=0;
        for(let i=0;i<weights.length;i++){acc+=weights[i];if(r<acc){idx=i;break;}}
        chosen.push(pool[idx]);
        pool.splice(idx,1);
    }
    return chosen;
}

function showLevelUp() {
    isLevelUp = true;
    let overlay = document.getElementById('levelup-overlay');
    let cardsEl = document.getElementById('levelup-cards');
    cardsEl.innerHTML = '';
    let choices = getRandom3();
    choices.forEach(u => {
        let card = document.createElement('div');
        card.className = `lvup-card ${u.rarity}`;
        card.innerHTML = `<div class="card-icon">${u.icon}</div><div class="card-name">${u.name}</div><div class="card-desc">${u.desc}</div><div class="card-rarity">${u.rarity.toUpperCase()}</div>`;
        const pick = () => { u.apply(); closeLevelUp(); updateUI(); };
        card.onclick = pick;
        card.addEventListener('touchend', e => { e.preventDefault(); pick(); }, { once: true });
        cardsEl.appendChild(card);
    });
    overlay.style.display = 'flex';
}

function closeLevelUp() {
    isLevelUp = false;
    document.getElementById('levelup-overlay').style.display = 'none';
}

// ─── 조이스틱 상태 ───
let joy = { active: false, id: null, sx: 0, sy: 0, dx: 0, dy: 0 };
// ─── 에임 터치 (오른쪽 드래그로 조준) ───
let aimTouch = { active: false, id: null };
// ─── 발사 상태 ───
let fireHeld = false, fireInterval = null;

// ─── 조이스틱 초기화 ───
const jZone = document.getElementById('joystick-zone');
const jKnob = document.getElementById('joystick-knob');
const JR = 30; // 최대 이동 반경(px)

jZone.addEventListener('touchstart', e => {
    e.preventDefault();
    let t = e.changedTouches[0];
    let rect = jZone.getBoundingClientRect();
    joy.active = true; joy.id = t.identifier;
    joy.sx = rect.left + rect.width/2;
    joy.sy = rect.top + rect.height/2;
    joy.dx = 0; joy.dy = 0;
}, { passive: false });

window.addEventListener('touchmove', e => {
    e.preventDefault();
    for(let t of e.changedTouches) {
        if(t.identifier === joy.id && joy.active) {
            let dx = t.clientX - joy.sx, dy = t.clientY - joy.sy;
            let dist = Math.hypot(dx, dy);
            if(dist > JR) { dx = dx/dist*JR; dy = dy/dist*JR; }
            joy.dx = dx; joy.dy = dy;
            jKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        }
        // 오른쪽 영역 드래그 → 에임
        if(t.identifier === aimTouch.id && aimTouch.active) {
            mouse.x = t.clientX; mouse.y = t.clientY;
        }
    }
}, { passive: false });

window.addEventListener('touchend', e => {
    for(let t of e.changedTouches) {
        if(t.identifier === joy.id) {
            joy.active = false; joy.dx = 0; joy.dy = 0;
            jKnob.style.transform = 'translate(-50%, -50%)';
        }
        if(t.identifier === aimTouch.id) aimTouch.active = false;
    }
});

// 캔버스 터치 → 에임 (오른쪽 절반)
canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    for(let t of e.changedTouches) {
        if(t.clientX > canvas.width * 0.35 && !aimTouch.active) {
            aimTouch.active = true; aimTouch.id = t.identifier;
            mouse.x = t.clientX; mouse.y = t.clientY;
        }
    }
}, { passive: false });

// ─── 발사 버튼 ───
const fireBtn = document.getElementById('fire-btn');

function startFire() {
    if(fireHeld) return;
    fireHeld = true;
    fireBtn.classList.add('pressed');
    tryFire();
    fireInterval = setInterval(tryFire, 80);
}
function stopFire() {
    fireHeld = false;
    fireBtn.classList.remove('pressed');
    clearInterval(fireInterval);
}

fireBtn.addEventListener('touchstart', e => { e.preventDefault(); startFire(); }, { passive: false });
fireBtn.addEventListener('touchend', e => { e.preventDefault(); stopFire(); }, { passive: false });

// ─── 상점 버튼 ───
document.getElementById('shop-btn').addEventListener('touchstart', e => { e.preventDefault(); toggleShop(); }, { passive: false });

// ─── 발사 로직 ───
function tryFire() {
    if(isShop || isLevelUp || player.hp <= 0) return;
    let now = Date.now(), w = WEAPONS[curW];
    if(now - lastFire > Math.max(50, w.cool - stats.spdBonus)) {
        let dmg = w.dmg + stats.atkBonus;
        if(curW === 2) {
            for(let i=-2; i<=2; i++) bullets.push({ x: player.x, y: player.y, vx: Math.cos(player.rot+i*0.15)*w.spd, vy: Math.sin(player.rot+i*0.15)*w.spd, dmg, p: w.p });
        } else {
            bullets.push({ x: player.x, y: player.y, vx: Math.cos(player.rot)*w.spd, vy: Math.sin(player.rot)*w.spd, dmg, p: w.p });
        }
        player.recoil = 15; lastFire = now;
        // 발사 피드백
        if(curW === 1) { addShake(2); spawnParticles(player.x + Math.cos(player.rot)*40, player.y + Math.sin(player.rot)*40, 4, WEAPONS[curW].color, 5, 8, 3); }
        if(curW === 2) { addShake(5); spawnParticles(player.x + Math.cos(player.rot)*35, player.y + Math.sin(player.rot)*35, 10, WEAPONS[curW].color, 7, 10, 4); }
        if(curW === 3) { addShake(8); spawnParticles(player.x + Math.cos(player.rot)*55, player.y + Math.sin(player.rot)*55, 6, WEAPONS[curW].color, 12, 12, 5); }
    }
}

// ─── PC 마우스 발사 ───
canvas.onmousedown = () => { if(!isShop && player.hp > 0) tryFire(); };

function init() {
    for(let i=0; i<40; i++) {
        let x = Math.random()*WORLD.w, y = Math.random()*WORLD.h;
        if(Math.hypot(x-player.x, y-player.y) > 500) obstacles.push({x, y, r: 30+Math.random()*40});
    }
    for(let i=0; i<20; i++) {
        let x = Math.random()*WORLD.w, y = Math.random()*WORLD.h;
        if(Math.hypot(x-player.x, y-player.y) > 500) barrels.push({x, y, r: 20});
    }
    spawnEnemy(); updateUI();
}

function update() {
    if(player.hp <= 0 || isShop || isLevelUp) return;

    // 조이스틱 이동
    let vx = keys['a'] ? -1 : keys['d'] ? 1 : 0;
    let vy = keys['w'] ? -1 : keys['s'] ? 1 : 0;

    if(joy.active && (joy.dx !== 0 || joy.dy !== 0)) {
        vx = (joy.dx / JR) * 0.5; vy = (joy.dy / JR) * 0.5;
    }

    if(vx || vy) {
        let m = Math.hypot(vx, vy) || 1;
        let nx = player.x + (vx/m)*player.spd, ny = player.y + (vy/m)*player.spd;
        nx = Math.max(player.r, Math.min(WORLD.w - player.r, nx));
        ny = Math.max(player.r, Math.min(WORLD.h - player.r, ny));
        let col = false;
        obstacles.forEach(o => { if(Math.hypot(nx-o.x, ny-o.y) < player.r+o.r) col = true; });
        if(!col) { player.x = nx; player.y = ny; }
    }

    cam.x += (player.x + (mouse.x - canvas.width/2)*0.2 - cam.x) * 0.1;
    cam.y += (player.y + (mouse.y - canvas.height/2)*0.2 - cam.y) * 0.1;
    player.rot = Math.atan2(mouse.y - canvas.height/2, mouse.x - canvas.width/2);
    if(player.recoil > 0) player.recoil *= 0.8;

    // 모바일 자동 에임: 가장 가까운 적 방향으로 조준
    if(joy.active && enemies.length > 0) {
        let nearest = null, minD = Infinity;
        enemies.forEach(e => {
            let d = Math.hypot(e.x - player.x, e.y - player.y);
            if(d < minD) { minD = d; nearest = e; }
        });
        if(nearest && !aimTouch.active) {
            // 월드 → 스크린 좌표
            let sx = (nearest.x - cam.x) + canvas.width/2;
            let sy = (nearest.y - cam.y) + canvas.height/2;
            mouse.x += (sx - mouse.x) * 0.15;
            mouse.y += (sy - mouse.y) * 0.15;
        }
    }

    for(let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx; b.y += b.vy;
        for(let j = enemies.length - 1; j >= 0; j--) {
            let e = enemies[j];
            if(Math.hypot(b.x-e.x, b.y-e.y) < e.r) { e.hp -= b.dmg; e.showHp = true; e.x += b.vx*0.1; e.y += b.vy*0.1; b.p--; }
        }
        if(b.p <= 0 || Math.hypot(b.x-player.x, b.y-player.y) > 1200) bullets.splice(i, 1);
    }

    let didLevelUp = false;
    for(let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        let ang = Math.atan2(player.y-e.y, player.x-e.x);
        e.x += Math.cos(ang)*e.spd; e.y += Math.sin(ang)*e.spd;
        if(Math.hypot(player.x-e.x, player.y-e.y) < player.r+e.r) {
            player.hp -= 0.4;
            addShake(3);
        }
        if(e.hp <= 0) {
            let isT = e.type==='tank';
            let isB = e.type==='boss';
            if(isB) {
                spawnParticles(e.x, e.y, 60, '#ff0055', 14, 50, 8);
                spawnParticles(e.x, e.y, 40, '#ffaa00', 10, 35, 6);
                spawnParticles(e.x, e.y, 20, '#ffffff', 18, 20, 4);
                addShake(25);
            } else {
                spawnParticles(e.x, e.y, isT?30:14, isT?'#ff0055':'#a29bfe', isT?9:6, isT?30:18, isT?6:4);
                spawnParticles(e.x, e.y, isT?15:6, '#fff', isT?12:8, isT?12:8, isT?4:2);
                addShake(isT ? 14 : 6);
            }
            enemies.splice(i, 1);
            stats.gold += e.reward;
            stats.totalKill++;
            // 보스 처치 시
            if(e.type === 'boss') {
                stats.bossKill++;
                stats.exp += 100;
            } else {
                stats.exp += 25;
            }
            if(stats.exp >= 100) { stats.lv++; stats.exp = 0; stats.pts++; didLevelUp = true; }
            stats.waveKill++;
            if(stats.waveKill > stats.wave*5) { stats.wave++; stats.waveKill = 0; }
            // 10킬마다 보스 소환 (보스 자신은 카운트 제외)
            if(e.type !== 'boss' && stats.totalKill % 10 === 0) {
                setTimeout(spawnBoss, 500);
            }
        }
    }
    updateUI();
    if(didLevelUp) showLevelUp();
    if(player.hp <= 0) document.getElementById('game-over').style.display = 'flex';
}

function draw() {
    // 화면 흔들림 계산
    if(screenShake > 0) {
        shakeX = (Math.random() - 0.5) * screenShake * 2;
        shakeY = (Math.random() - 0.5) * screenShake * 2;
        screenShake *= 0.82;
        if(screenShake < 0.3) { screenShake = 0; shakeX = 0; shakeY = 0; }
    }

    ctx.fillStyle = "#050505"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(canvas.width/2 - cam.x + shakeX, canvas.height/2 - cam.y + shakeY);

    ctx.strokeStyle = "#111";
    for(let i=0; i<WORLD.w; i+=100) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, WORLD.h); ctx.stroke(); }
    for(let i=0; i<WORLD.h; i+=100) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(WORLD.w, i); ctx.stroke(); }

    ctx.fillStyle = "#1a1a20"; obstacles.forEach(o => { ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, 7); ctx.fill(); });
    ctx.fillStyle = "#f1c40f"; barrels.forEach(b => { ctx.fillRect(b.x-15, b.y-15, 30, 30); });

    // 파티클 업데이트 & 렌더링
    for(let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.vx *= 0.88; p.vy *= 0.88;
        p.life--;
        if(p.life <= 0) { particles.splice(i, 1); continue; }
        let alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 6; ctx.shadowColor = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;

    enemies.forEach(e => {
        if(e.type === 'boss') {
            e.pulse = (e.pulse || 0) + 0.06;
            let glow = Math.sin(e.pulse) * 0.5 + 0.5;
            // 보스 외곽 링
            ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 10 + glow*8, 0, Math.PI*2);
            ctx.strokeStyle = `rgba(255,50,50,${0.3 + glow*0.4})`; ctx.lineWidth = 3; ctx.stroke();
            ctx.lineWidth = 1;
            // 보스 본체
            let grad = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r);
            grad.addColorStop(0, '#ff6666'); grad.addColorStop(1, '#880000');
            ctx.fillStyle = grad;
            ctx.shadowBlur = 30 + glow*20; ctx.shadowColor = '#ff0000';
            ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
            // 보스 등급 표시
            ctx.fillStyle = '#fff'; ctx.font = `bold ${14}px sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(`BOSS ${e.tier}`, e.x, e.y);
            ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
            // HP바 (더 크게)
            ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(e.x - e.r, e.y - e.r - 16, e.r*2, 8);
            ctx.fillStyle = '#ff0055'; ctx.fillRect(e.x - e.r, e.y - e.r - 16, (e.r*2)*(e.hp/e.maxHp), 8);
            ctx.strokeStyle = '#ff0055'; ctx.strokeRect(e.x - e.r, e.y - e.r - 16, e.r*2, 8);
        } else {
            ctx.fillStyle = e.type==='tank'?'#ff0055':'#a29bfe';
            ctx.shadowBlur = 0;
            ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, 7); ctx.fill();
            if(e.showHp) {
                ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(e.x-e.r, e.y-e.r-12, e.r*2, 5);
                ctx.fillStyle = "#00ffcc"; ctx.fillRect(e.x-e.r, e.y-e.r-12, (e.r*2)*(e.hp/e.maxHp), 5);
            }
        }
    });

    // 보스 경고 텍스트
    if(bossWarningTimer > 0) {
        bossWarningTimer--;
        let alpha = Math.min(1, bossWarningTimer / 30);
        if(bossWarningTimer < 30) alpha = bossWarningTimer / 30;
        let pulse = Math.sin(Date.now() * 0.01) * 0.3 + 0.7;
        ctx.save();
        ctx.globalAlpha = alpha * pulse;
        ctx.font = `bold ${clamp(28, 5, 48)}px sans-serif`;
        ctx.fillStyle = '#ff0000';
        ctx.shadowBlur = 20; ctx.shadowColor = '#ff0000';
        ctx.textAlign = 'center';
        ctx.fillText(`⚠ BOSS ${bossWarningTier} 출현 ⚠`, canvas.width/2, canvas.height/2 - 60);
        ctx.font = `${clamp(16, 3, 22)}px sans-serif`;
        ctx.fillStyle = '#ffaaaa';
        ctx.fillText(`적 ${stats.totalKill}킬 달성`, canvas.width/2, canvas.height/2 - 25);
        ctx.shadowBlur = 0; ctx.globalAlpha = 1; ctx.textAlign = 'left';
        ctx.restore();
    }

    ctx.fillStyle = "#00ffcc"; bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, 7); ctx.fill(); });

    ctx.save();
    ctx.translate(player.x, player.y); ctx.rotate(player.rot);
    ctx.fillStyle = "#00ffcc"; ctx.shadowBlur = 15; ctx.shadowColor = "#00ffcc";
    ctx.beginPath(); ctx.arc(0, 0, player.r, 0, 7); ctx.fill();
    ctx.translate(-player.recoil, 0); ctx.fillStyle = WEAPONS[curW].color;
    ctx.fillRect(18, -4, WEAPONS[curW].len, 8);
    ctx.restore();

    ctx.restore(); update(); requestAnimationFrame(draw);
}

function spawnBoss() {
    let a = Math.random() * Math.PI * 2;
    let x = player.x + Math.cos(a) * 900, y = player.y + Math.sin(a) * 900;
    let tier = stats.bossKill + 1; // 보스 등급 (잡을수록 강해짐)
    let hp = 300 + tier * 150;
    enemies.push({
        x, y, type: 'boss',
        hp, maxHp: hp, showHp: true,
        spd: 1.8 + tier * 0.2,
        r: 48,
        reward: 500 + tier * 200,
        tier,
        pulse: 0  // 보스 시각 효과용
    });
    // 보스 등장 경고
    showBossWarning(tier);
    addShake(12);
}

let bossWarningTimer = 0;
let bossWarningTier = 0;
function showBossWarning(tier) {
    bossWarningTier = tier;
    bossWarningTimer = 180; // 3초(60fps)
}

function spawnEnemy() {
    if(!isShop && player.hp > 0) {
        let a = Math.random()*7, x = player.x + Math.cos(a)*1000, y = player.y + Math.sin(a)*1000;
        let type = Math.random() > 0.85 ? 'tank' : 'norm';
        let hp = type==='tank'?50+stats.wave*15:10+stats.wave*3;
        enemies.push({ x, y, type, hp, maxHp: hp, showHp: false, spd: type==='tank'?1.4:2.6, r: type==='tank'?30:18, reward: type==='tank'?150:40 });
    }
    setTimeout(spawnEnemy, Math.max(300, 1500 - stats.wave*80));
}

function clamp(val, vmin, vmax) { return Math.min(vmax, Math.max(vmin, val)); }

function resetGame() {
    // 상태 초기화
    player.x = 1500; player.y = 1500; player.spd = 5.5; player.hp = 100; player.rot = 0; player.recoil = 0;
    cam.x = 1500; cam.y = 1500;
    bullets = []; enemies = []; obstacles = []; barrels = []; particles = [];
    stats = { lv: 1, exp: 0, gold: 0, pts: 0, wave: 1, waveKill: 0, atkBonus: 0, spdBonus: 0, totalKill: 0, bossKill: 0 };
    curW = 1; lastFire = 0; isShop = false; isLevelUp = false;
    screenShake = 0; shakeX = 0; shakeY = 0;
    bossWarningTimer = 0; bossWarningTier = 0;

    // 무기 초기화
    WEAPONS[1].unlocked = true; WEAPONS[1].p = 1;
    WEAPONS[2].unlocked = false; WEAPONS[2].p = 1;
    WEAPONS[3].unlocked = false; WEAPONS[3].p = 1;

    // UI 초기화
    document.getElementById('game-over').style.display = 'none';
    document.getElementById('shop').style.display = 'none';
    document.getElementById('levelup-overlay').style.display = 'none';
    document.getElementById('slot1').innerText = '1. 라이플'; document.getElementById('slot1').className = 'slot unlocked active';
    document.getElementById('slot2').innerText = '2. 잠김';   document.getElementById('slot2').className = 'slot';
    document.getElementById('slot3').innerText = '3. 잠김';   document.getElementById('slot3').className = 'slot';
    document.getElementById('buy-w2').disabled = false;
    document.getElementById('buy-w3').disabled = false;

    init();
}

function toggleShop() { if(player.hp>0) { isShop = !isShop; document.getElementById('shop').style.display = isShop?'block':'none'; } }
function upgrade(t) { if(stats.pts > 0) { if(t==='atk') stats.atkBonus+=3; if(t==='spd') stats.spdBonus+=40; if(t==='mov') player.spd+=0.5; stats.pts--; updateUI(); } }
function buyWeapon(id, g) { if(stats.gold >= g && !WEAPONS[id].unlocked) { stats.gold -= g; WEAPONS[id].unlocked = true; document.getElementById('slot'+id).innerText = id+". "+WEAPONS[id].name; document.getElementById('slot'+id).classList.add('unlocked'); document.getElementById('buy-w'+id).disabled = true; updateUI(); } }
function buyItem(t, g) { if(t==='heal' && stats.gold >= g) { stats.gold -= g; player.hp = Math.min(100, player.hp+40); updateUI(); } }
function updateUI() { document.getElementById('lv').innerText = stats.lv; document.getElementById('exp').innerText = stats.exp; document.getElementById('gold').innerText = stats.gold; document.getElementById('pts').innerText = stats.pts; document.getElementById('hp').innerText = Math.floor(player.hp); document.getElementById('wave').innerText = stats.wave; }

function switchWeapon(id) {
    if(!WEAPONS[id].unlocked) return;
    curW = id;
    document.querySelectorAll('.slot').forEach((s, i) => {
        s.classList.remove('active');
        if(i + 1 === id) s.classList.add('active');
    });
}

// 슬롯 터치/클릭으로 무기 전환
document.querySelectorAll('.slot').forEach((s, i) => {
    const id = i + 1;
    s.addEventListener('click', () => switchWeapon(id));
    s.addEventListener('touchend', e => { e.preventDefault(); switchWeapon(id); }, { passive: false });
    s.style.cursor = 'pointer';
});

// PC 키보드
window.onkeydown = e => {
    keys[e.key.toLowerCase()] = true; if(e.key === 'g') toggleShop();
    if(['1','2','3'].includes(e.key)) switchWeapon(parseInt(e.key));
};
window.onkeyup = e => keys[e.key.toLowerCase()] = false;
window.onmousemove = e => { mouse.x = e.clientX; mouse.y = e.clientY; };

init(); draw();
</script>
</body>
</html>
